<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snails" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
    />
    <title>Snails - Controller</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: -webkit-fill-available;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        background: var(--snl-ink);
        color: var(--snl-paper);
        font-family: var(--snl-font);
        touch-action: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      input {
        -webkit-user-select: text;
        user-select: text;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .panel {
        background: rgba(var(--snl-ink-rgb), 0.92);
        padding: 12px;
        border-radius: var(--snl-radius);
        margin: 12px;
        box-shadow: var(--snl-shadow);
      }
      .panel label {
        display: block;
        margin: 6px 0;
      }
      button {
        font-family: inherit;
        font-size: var(--snl-text-m);
        font-weight: 700;
        min-height: 44px;
        padding: 12px 20px;
        border-radius: var(--snl-radius);
        border: 0;
        background: rgba(var(--snl-paper-rgb), 0.14);
        color: var(--snl-paper);
      }
      button.primary {
        background: var(--snl-accent);
        color: var(--snl-ink);
      }
      #screen {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
