<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>Snails - Controller</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101820;
        color: #fff;
        font-family: system-ui, sans-serif;
        touch-action: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .panel {
        background: rgba(16, 24, 32, 0.8);
        padding: 12px;
        border-radius: 12px;
        margin: 12px;
      }
      .panel label {
        display: block;
        margin: 6px 0;
      }
      button {
        font-size: 1.2rem;
        padding: 12px 20px;
        border-radius: 8px;
        border: 0;
      }
      #screen {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .join {
        pointer-events: auto;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #101820;
        touch-action: manipulation;
      }
      .join h1 {
        text-align: center;
        margin: 0;
      }
      .join input {
        font-size: 1.3rem;
        min-height: 56px;
        padding: 0 16px;
        border-radius: 12px;
        border: 2px solid #2a3a4a;
        background: #1a2631;
        color: #fff;
      }
      .join #room {
        text-transform: uppercase;
        letter-spacing: 0.4em;
        text-align: center;
      }
      .join button {
        min-height: 56px;
      }
      .join button:disabled {
        opacity: 0.4;
      }
      .join .status {
        text-align: center;
        min-height: 1.4em;
        margin: 0;
      }
      .lobby {
        justify-content: flex-start;
        overflow: auto;
      }
      .lobby .roster {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .lobby .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .lobby .pick {
        min-width: 56px;
        min-height: 56px;
        border: 3px solid transparent;
      }
      .lobby .pick.on {
        border-color: #fff;
      }
      .lobby .pick:disabled {
        opacity: 0.2;
      }
      .lobby .settings label {
        display: block;
        margin: 6px 0;
      }
      .lobby .settings input {
        width: 6em;
        min-height: 40px;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
