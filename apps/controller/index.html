<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>Snails - Controller</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101820;
        color: #fff;
        font-family: system-ui, sans-serif;
        touch-action: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .panel {
        background: rgba(16, 24, 32, 0.8);
        padding: 12px;
        border-radius: 12px;
        margin: 12px;
      }
      .panel label {
        display: block;
        margin: 6px 0;
      }
      button {
        font-size: 1.2rem;
        padding: 12px 20px;
        border-radius: 8px;
        border: 0;
      }
      #join {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        background: #101820;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <form id="join">
      <h1>Snails</h1>
      <input id="name" placeholder="Your name" required maxlength="32" />
      <input id="room" placeholder="Room code" required maxlength="16" />
      <button type="submit">Join</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
