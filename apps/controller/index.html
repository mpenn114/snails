<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snails" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>Snails - Controller</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: -webkit-fill-available;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        background: var(--snl-ink);
        color: var(--snl-paper);
        font-family: var(--snl-font);
        touch-action: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      input {
        -webkit-user-select: text;
        user-select: text;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .panel {
        background: rgba(var(--snl-ink-rgb), 0.92);
        padding: 12px;
        border-radius: var(--snl-radius);
        margin: 12px;
        box-shadow: var(--snl-shadow);
      }
      .panel label {
        display: block;
        margin: 6px 0;
      }
      button {
        font-family: inherit;
        font-size: var(--snl-text-m);
        font-weight: 700;
        min-height: 44px;
        padding: 12px 20px;
        border-radius: var(--snl-radius);
        border: 0;
        background: rgba(var(--snl-paper-rgb), 0.14);
        color: var(--snl-paper);
      }
      button.primary {
        background: var(--snl-accent);
        color: var(--snl-ink);
      }
      #screen {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .join {
        pointer-events: auto;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: var(--snl-ink);
        touch-action: manipulation;
      }
      .join h1 {
        font-size: var(--snl-text-xl);
        font-weight: 800;
        text-align: center;
        margin: 0;
      }
      .join input {
        font-family: inherit;
        font-size: var(--snl-text-l);
        min-height: 56px;
        padding: 0 16px;
        border-radius: var(--snl-radius);
        border: var(--snl-outline) solid rgba(var(--snl-paper-rgb), 0.25);
        background: rgba(var(--snl-paper-rgb), 0.08);
        color: var(--snl-paper);
      }
      .join #room {
        text-transform: uppercase;
        letter-spacing: 0.4em;
        text-align: center;
      }
      .join button {
        min-height: 56px;
      }
      .join button:disabled {
        opacity: 0.4;
      }
      .join .status {
        text-align: center;
        min-height: 1.4em;
        margin: 0;
      }
      .lobby {
        justify-content: flex-start;
        overflow: auto;
      }
      .lobby .roster {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .lobby .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .lobby .pick {
        min-width: 56px;
        min-height: 56px;
        border: 3px solid transparent;
      }
      .lobby .pick {
        color: #000;
        font-size: 1.4em;
        text-shadow: 0 0 3px #fff;
      }
      .team-glyph {
        margin-right: 0.3em;
      }
      .lobby .pick.on {
        border-color: var(--snl-paper);
      }
      .lobby .pick:disabled {
        opacity: 0.2;
      }
      .lobby .settings label {
        display: block;
        margin: 6px 0;
      }
      .lobby .settings input {
        width: 6em;
        min-height: 40px;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
