<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snails - Display</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--snl-ink);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .lobby {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--snl-ink);
        color: var(--snl-paper);
        font-family: var(--snl-font);
      }
      .lobby[hidden] {
        display: none;
      }
      .lobby-card {
        display: flex;
        gap: 6vw;
        align-items: center;
      }
      .lobby .code {
        font-size: 12vw;
        font-weight: 800;
        letter-spacing: 0.15em;
      }
      .lobby .url {
        font-size: 2vw;
      }
      .lobby .qr svg {
        width: 22vw;
        height: 22vw;
      }
      .lobby .teams {
        display: flex;
        gap: 2vw;
        flex-wrap: wrap;
        font-size: 2vw;
      }
      .lobby ul {
        list-style: none;
        padding: 0;
      }
      .lobby em {
        opacity: 0.6;
        font-size: 0.7em;
      }
      .lobby .dot {
        display: inline-block;
        width: 1em;
        height: 1em;
        border-radius: 50%;
        margin-right: 0.4em;
        vertical-align: middle;
      }
      .lobby .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6vw;
        margin: 1.5vw 0 0;
        padding: 0;
        font-size: 1.4vw;
      }
      .lobby .chips li {
        padding: 0.3vw 1vw;
        background: rgba(var(--snl-paper-rgb, 255, 255, 255), 0.12);
        border-radius: 999px;
      }
      .lobby .chips span {
        opacity: 0.6;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: var(--snl-font);
        color: var(--snl-paper);
        text-shadow: 0 1px 4px rgba(var(--snl-ink-rgb), 0.9);
      }
      .hud[hidden] {
        display: none;
      }
      .hud .turn {
        position: absolute;
        top: 2vh;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.5vw 2vw;
        font-size: 2.4vw;
        background: rgba(var(--snl-ink-rgb), 0.75);
        border: 0.3vw solid;
        border-radius: var(--snl-radius);
        font-weight: 700;
      }
      .hud .timer {
        margin-left: 1.5vw;
        font-weight: 800;
      }
      .research-banner-slot {
        position: fixed;
        top: 6vh;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 5;
      }
      .research-banner {
        padding: 0.6vw 2.4vw;
        font-size: 2.6vw;
        font-weight: 800;
        color: var(--snl-paper);
        background: rgba(var(--snl-ink-rgb), 0.82);
        border-bottom: 0.4vw solid;
        border-radius: var(--snl-radius);
        animation: banner-in 0.35s ease-out;
      }
      @keyframes banner-in {
        from {
          opacity: 0;
          transform: translateY(-2vh) scale(0.94);
        }
      }
      .hud .notice {
        position: absolute;
        top: 12vh;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.4vw 1.6vw;
        font-size: 2vw;
        font-weight: 700;
        background: rgba(var(--snl-ink-rgb), 0.75);
        border-bottom: 0.25vw solid var(--snl-paper);
      }
      .hud .bars {
        position: absolute;
        left: 2vw;
        bottom: 2vh;
        width: 24vw;
        font-size: 1.4vw;
      }
      .hud .bar {
        position: relative;
        margin-top: 0.5vw;
        background: rgba(var(--snl-ink-rgb), 0.6);
        height: 2.2vw;
        overflow: hidden;
        border-radius: var(--snl-outline);
        opacity: 0.8;
      }
      .hud .bar.active {
        opacity: 1;
        outline: 0.2vw solid var(--snl-paper);
      }
      .hud .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        opacity: 0.7;
      }
      .hud .bar span {
        position: relative;
        z-index: 1;
        padding-left: 0.6vw;
        line-height: 2.2vw;
      }
      .hud .winner {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        font-size: 8vw;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="lobby-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
